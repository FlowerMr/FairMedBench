[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairmedbench"
version = "0.1.0"
description = "A modular benchmark for medical image classification across performance, subgroup fairness, explainability, uncertainty, and robustness."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "FairMedBench Contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "Pillow>=10,<13",
  "PyYAML>=6.0,<7",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "captum>=0.7,<1",
  "timm>=0.9,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
notebook = ["jupyter>=1.0,<2"]
shap = ["shap>=0.45,<1"]

[project.scripts]
fairmedbench = "fairmedbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
